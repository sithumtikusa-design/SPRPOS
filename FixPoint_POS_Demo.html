function renderPOS(){const filtered=data.products.filter(p=>(filters.category==='All'||p.category===filters.category)&&(`${p.name} ${p.id}`.toLowerCase().includes(filters.pos.toLowerCase())));let sub=cart.reduce((n,i)=>n+i.qty*(product(i.id)?.price||0),0),disc=Math.min(Math.max(0,discount),sub);return `<div class="toolbar"><div class="toolbar-left"><div class="search">${icon('search')}<input id="pos-search" placeholder="Search products or services..." value="${esc(filters.pos)}" data-filter="pos" autocomplete="off"></div></div><span class="page-summary">${data.products.length} products & services available</span></div><div class="pos-layout"><div><div class="filter-tabs" style="width:max-content;max-width:100%;margin-bottom:17px">${['All','Accessories','Parts','Services'].map(c=>`<button class="filter-tab ${filters.category===c?'selected':''}" data-category="${c}">${c}</button>`).join('')}</div><div class="products-grid">${filtered.map(p=>`<button class="product-card" data-add="${p.id}" ${p.category!=='Services'&&p.stock<=0?'disabled':''}><div class="product-top"><div class="product-img">${esc(p.emoji||'📦')}</div><span class="product-cat">${esc(p.category)}</span></div><div class="product-name">${esc(p.name)}</div><div class="product-bottom"><span class="product-price">${shortMoney(p.price)}</span><span class="product-stock">${p.category==='Services'?'Service':p.stock+' in stock'}</span></div></button>`).join('')||'<div class="empty" style="grid-column:1/-1">No products match your search.</div>'}</div></div>
<section class="panel cart-panel"><div class="cart-header"><div><h3>Current sale</h3><small>${cart.reduce((a,c)=>a+c.qty,0)} items in cart</small></div><button class="btn btn-light btn-sm" data-action="clear-cart" ${cart.length?'':'disabled'}>Clear</button></div><div class="cart-body"><label class="field-label">Customer</label><select class="field-select" id="cart-customer">${selectCustomers(cartCustomer,true)}</select><div class="cart-items">${cart.length?cart.map(i=>{let p=product(i.id);if(!p)return'';return `<div class="cart-item">${productIcon(p)}<div class="cart-info"><div class="cart-name">${esc(p.name)}</div><div class="cart-money">${shortMoney(p.price)} each</div><div class="qty"><button data-cartminus="${p.id}" aria-label="Decrease quantity">−</button><span>${i.qty}</span><button data-cartplus="${p.id}" aria-label="Increase quantity">+</button></div></div><div class="cart-line-total">${shortMoney(p.price*i.qty)}<div style="text-align:right;margin-top:12px"><button class="btn btn-light btn-icon btn-sm" data-remove="${p.id}" aria-label="Remove item">${icon('x')}</button></div></div></div>`}).join(''):`<div class="empty">${icon('pos')}<strong>Your cart is empty</strong><p>Select an item on the left to start a new sale.</p></div>`}</div><div class="cart-totals"><div class="total-line"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="total-line"><span>Discount (Rs.)</span><input aria-label="Discount amount" id="cart-discount" type="number" min="0" step="0.01" value="${discount}" class="field-input" style="width:110px;text-align:right;min-height:32px;padding:7px 9px"></div><div class="total-grand"><span>Total Due</span><strong>${shortMoney(sub-disc)}</strong></div></div></div><div class="cart-footer"><button class="btn btn-primary" data-action="checkout" ${cart.length?'':'disabled'}>${icon('check')} Complete sale</button><div style="font-size:10px;text-align:center;color:#99a6b5;margin-top:10px">Stock automatically reduces after checkout</div></div></section></div>`}
function renderJobs(){let filtered=[...data.jobs].filter(j=>(filters.jobStatus==='All'||j.status===filters.jobStatus)&&(`${j.id} ${j.device} ${j.issue} ${customerName(j.customerId)}`.toLowerCase().includes(filters.jobs.toLowerCase()))).sort((a,b)=>b.id.localeCompare(a.id));return `<div class="small-stats"><div class="panel mini-stat"><div class="stat-label">Active repairs</div><div class="stat-value">${data.jobs.filter(jobOpen).length}</div></div><div class="panel mini-stat"><div class="stat-label">Ready for pickup</div><div class="stat-value">${data.jobs.filter(j=>j.status==='Ready').length}</div></div><div class="panel mini-stat"><div class="stat-label">Completed jobs</div><div class="stat-value">${data.jobs.filter(j=>j.status==='Completed').length}</div></div></div><div class="toolbar"><div class="toolbar-left"><div class="search">${icon('search')}<input id="jobs-search" data-filter="jobs" value="${esc(filters.jobs)}" placeholder="Search job, customer or device..."></div><select id="job-status-filter" class="field-select" style="width:172px"><option>All</option>${['In Progress','Awaiting Parts','Ready','Completed','Cancelled'].map(s=>`<option ${filters.jobStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="new-job">${icon('plus')} New Job Card</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Job ID / Date</th><th>Customer</th><th>Device / Issue</th><th>Technician</th><th>Estimate</th><th>Status</th><th>Action</th></tr></thead><tbody>${filtered.map(j=>`<tr><td><span class="cell-title">${esc(j.id)}</span><span class="cell-sub">${niceDate(j.created)}</span></td><td><span class="cell-title">${esc(customerName(j.customerId))}</span><span class="cell-sub">${esc(customer(j.customerId)?.phone||'')}</span></td><td><span class="cell-title">${esc(j.device)}</span><span class="cell-sub" title="${esc(j.issue)}">${esc(j.issue.length>45?j.issue.slice(0,45)+'…':j.issue)}</span></td><td>${esc(j.technician||'Unassigned')}</td><td class="cell-title">${shortMoney(j.estimate)}</td><td>${status(j.status)}</td><td><button class="table-link" data-action="view-job" data-id="${j.id}">Details →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No repair jobs found.</td></tr>'}</tbody></table></div>`}
function renderQuotes(){let filtered=[...data.quotes].filter(q=>(filters.quoteStatus==='All'||q.status===filters.quoteStatus)&&(`${q.id} ${q.device} ${customerName(q.customerId)}`.toLowerCase().includes(filters.quotes.toLowerCase()))).sort((a,b)=>b.id.localeCompare(a.id));return `<div class="toolbar"><div class="toolbar-left"><div class="search">${icon('search')}<input id="quotes-search" data-filter="quotes" value="${esc(filters.quotes)}" placeholder="Search quotation or customer..."></div><select id="quote-status-filter" class="field-select" style="width:155px"><option>All</option>${['Draft','Sent','Approved','Declined'].map(s=>`<option ${filters.quoteStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="new-quote">${icon('plus')} New Quotation</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Quote / Issued</th><th>Customer</th><th>Device</th><th>Amount</th><th>Valid Until</th><th>Status</th><th>Action</th></tr></thead><tbody>${filtered.map(q=>`<tr><td><span class="cell-title">${esc(q.id)}</span><span class="cell-sub">${niceDate(q.created)}</span></td><td><span class="cell-title">${esc(customerName(q.customerId))}</span></td><td>${esc(q.device)}</td><td><span class="cell-title">${shortMoney(quoteTotal(q))}</span></td><td>${niceDate(q.valid)}</td><td>${status(q.status)}</td><td><button class="table-link" data-action="view-quote" data-id="${q.id}">Details →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No quotations found.</td></tr>'}</tbody></table></div><div class="note" style="margin-top:18px">Tip: Open an approved quotation and use <strong>Convert to Job Card</strong> to create a repair job without retyping the customer, device or estimate.</div>`}
function renderInventory(){let filtered=data.products.filter(p=>(filters.inventoryCategory==='All'||p.category===filters.inventoryCategory)&&(`${p.name} ${p.id}`.toLowerCase().includes(filters.inventory.toLowerCase())));let valued=data.products.reduce((a,p)=>a+p.cost*p.stock,0);return `<div class="small-stats"><div class="panel mini-stat"><div class="stat-label">Products & services</div><div class="stat-value">${data.products.length}</div></div><div class="panel mini-stat"><div class="stat-label">Low / out of stock</div><div class="stat-value">${lowStock().length}</div></div><div class="panel mini-stat"><div class="stat-label">Stock cost value</div><div class="stat-value">${shortMoney(valued)}</div></div></div><div class="toolbar"><div class="toolbar-left"><div class="search">${icon('search')}<input id="inventory-search" data-filter="inventory" value="${esc(filters.inventory)}" placeholder="Search stock item or SKU..."></div><select id="inventory-cat-filter" class="field-select" style="width:160px"><option>All</option>${['Parts','Accessories','Services'].map(c=>`<option ${filters.inventoryCategory===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="new-product">${icon('plus')} Add Product</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Product / SKU</th><th>Category</th><th>Cost</th><th>Selling Price</th><th>Quantity</th><th>Stock Status</th><th>Actions</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><div class="inventory-name">${productIcon(p)}<div><div class="cell-title">${esc(p.name)}</div><span class="cell-sub">${p.id}</span></div></div></td><td>${esc(p.category)}</td><td>${shortMoney(p.cost)}</td><td><span class="cell-title">${shortMoney(p.price)}</span></td><td><span class="cell-title">${p.category==='Services'?'—':p.stock}</span><span class="cell-sub">${p.category==='Services'?'Not tracked':'Min: '+p.reorder}</span></td><td>${badgeStock(p)}</td><td><div class="action-row"><button class="btn btn-light btn-sm" data-action="edit-product" data-id="${p.id}">${icon('edit')} Edit</button>${p.category==='Services'?'':`<button class="btn btn-soft btn-sm" data-action="adjust-stock" data-id="${p.id}">+ / −</button>`}</div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No products found.</td></tr>'}</tbody></table></div>`}
function renderCustomers(){let filtered=data.customers.filter(c=>`${c.name} ${c.phone} ${c.email} ${c.device}`.toLowerCase().includes(filters.customers.toLowerCase()));return `<div class="toolbar"><div class="toolbar-left"><div class="search">${icon('search')}<input id="customers-search" data-filter="customers" value="${esc(filters.customers)}" placeholder="Search name, phone or device..."></div></div><button class="btn btn-primary" data-action="new-customer">${icon('plus')} Add Customer</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Phone Number</th><th>Primary Device</th><th>Jobs</th><th>Action</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><div class="row-flex"><div class="customer-avatar">${esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><div class="cell-title">${esc(c.name)}</div><span class="cell-sub">${esc(c.email||c.id)}</span></div></div></td><td>${esc(c.phone)}</td><td>${esc(c.device||'Not specified')}</td><td>${data.jobs.filter(j=>j.customerId===c.id).length}</td><td><button class="btn btn-light btn-sm" data-action="edit-customer" data-id="${c.id}">${icon('edit')} Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers found.</td></tr>'}</tbody></table></div>`}
function renderReports(){let total=data.sales.reduce((a,s)=>a+s.total,0),units=data.sales.reduce((a,s)=>a+s.items.reduce((n,i)=>n+i.qty,0),0),avg=data.sales.length?total/data.sales.length:0;let daily=Array.from({length:7},(_,i)=>{let day=offsetDay(i-6);return {day,amount:data.sales.filter(s=>s.date===day).reduce((a,s)=>a+s.total,0)}});let max=Math.max(...daily.map(d=>d.amount),1);let byItem={};data.sales.forEach(s=>s.items.forEach(i=>{let k=i.productId||i.name;if(!byItem[k])byItem[k]={name:i.name,qty:0,sales:0};byItem[k].qty+=i.qty;byItem[k].sales+=i.qty*i.price}));let top=Object.values(byItem).sort((a,b)=>b.sales-a.sales).slice(0,5);return `<div class="small-stats"><div class="panel mini-stat"><div class="stat-label">Total Sales (All time)</div><div class="stat-value">${shortMoney(total)}</div></div><div class="panel mini-stat"><div class="stat-label">Transactions / Items sold</div><div class="stat-value">${data.sales.length} <span style="font-size:13px;color:#95a1b2">/ ${units}</span></div></div><div class="panel mini-stat"><div class="stat-label">Average Sale Value</div><div class="stat-value">${shortMoney(avg)}</div></div></div><div class="report-grid"><div class="panel chart-panel"><div class="section-head"><div><h2>Sales performance</h2><p>Last 7 days · Sri Lankan Rupees (LKR)</p></div><span class="badge stock">Live demo data</span></div><div class="bar-chart">${daily.map(d=>`<div class="bar-col" title="${niceDate(d.day)}: ${money(d.amount)}"><div class="bar" style="height:${Math.max(3,d.amount/max*100)}%"></div><span>${new Date(d.day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'})}</span></div>`).join('')}</div><div class="info-pair" style="margin-top:38px"><span>Sales this week</span><strong>${shortMoney(daily.reduce((a,d)=>a+d.amount,0))}</strong></div></div><div class="panel"><div class="panel-head"><div><h3>Top selling items</h3><small>Ranked by revenue</small></div></div><div class="top-products">${top.map((p,i)=>`<div class="top-product"><span class="rank">${String(i+1).padStart(2,'0')}</span><div class="details"><strong>${esc(p.name)}</strong><small>${p.qty} units sold</small></div><div class="amount">${shortMoney(p.sales)}</div></div>`).join('')||'<div class="empty">No sales yet.</div>'}</div></div></div><div class="toolbar"><h2 style="margin:0;font-size:16px">Recent transactions</h2><button class="btn btn-light btn-sm" data-action="export">${icon('download')} Export backup (JSON)</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Sale ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Receipt</th></tr></thead><tbody>${[...data.sales].reverse().slice(0,20).map(s=>`<tr><td><span class="cell-title">${esc(s.id)}</span></td><td>${niceDate(s.date)}</td><td>${esc(customerName(s.customerId))}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td class="cell-title">${shortMoney(s.total)}</td><td><button class="table-link" data-action="view-sale" data-id="${s.id}">View receipt →</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No transactions yet.</td></tr>'}</tbody></table></div>`}
function modalShell(title,sub,body,footer='',wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2 class="modal-title">${esc(title)}</h2><div class="modal-sub">${esc(sub)}</div></div><button class="btn btn-light btn-icon" data-action="close-modal" aria-label="Close">${icon('x')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div></div>`}
const field=(label,name,type='text',val='',required=false,extra='')=>`<div><label class="field-label" for="f-${name}">${esc(label)}${required?' *':''}</label><input id="f-${name}" name="${name}" class="field-input" type="${type}" value="${esc(val)}" ${required?'required':''} ${extra}></div>`;
const selectField=(label,name,opts,current='')=>`<div><label class="field-label" for="f-${name}">${esc(label)}</label><select id="f-${name}" class="field-select" name="${name}" required>${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===current?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
const textArea=(label,name,val='')=>`<div class="field-full"><label class="field-label" for="f-${name}">${esc(label)}</label><textarea id="f-${name}" class="field-area" name="${name}">${esc(val)}</textarea></div>`;
const formFooter=(label)=>`<button class="btn btn-light" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="modal-form">${icon('check')} ${esc(label)}</button>`;
function openCustomer(id=null){const c=customer(id)||{};modalShell(id?'Edit Customer':'Add Customer',id?'Update customer contact and device information':'Register someone new at the service desk',`<form id="modal-form" data-form="customer" data-id="${esc(id||'')}"><div class="form-grid">${field('Full name','name','text',c.name,true)}${field('Phone number','phone','tel',c.phone,true)}${field('Email (optional)','email','email',c.email)}${field('Primary device','device','text',c.device)}</div></form>`,formFooter(id?'Save Changes':'Add Customer'))}
function openProduct(id=null){const p=product(id)||{name:'',category:'Parts',cost:0,price:0,stock:0,reorder:3,emoji:'📦'};modalShell(id?'Edit Inventory Item':'Add Inventory Item',id?'Edit product information, price or quantity':'Register a new stock item or service',`<form id="modal-form" data-form="product" data-id="${esc(id||'')}"><div class="form-grid">${field('Item name','name','text',p.name,true)}${selectField('Category','category',[['Parts','Spare Parts'],['Accessories','Accessories'],['Services','Repair Service']],p.category)}${field('Cost price (Rs.)','cost','number',p.cost,true,'min="0" step="0.01"')}${field('Selling price (Rs.)','price','number',p.price,true,'min="0" step="0.01"')}${field('Current quantity','stock','number',p.stock,true,'min="0" step="1"')}${field('Reorder alert level','reorder','number',p.reorder,true,'min="0" step="1"')}${field('Display emoji','emoji','text',p.emoji,false,'maxlength="3"')}</div><p style="font-size:11px;color:#94a2b1;line-height:1.6;margin-top:14px">Service items are not stock-tracked. For physical items, checkout will automatically update quantities.</p></form>`,formFooter(id?'Save Item':'Add Item'))}
function openStock(id){let p=product(id);if(!p)return;modalShell('Adjust Stock',`${p.id} · ${p.name}`,`<div class="note">Current stock: <strong>${p.stock} units</strong>. Use a positive number to receive stock or a negative number to correct inventory.</div><form id="modal-form" data-form="stock" data-id="${p.id}"><label class="field-label">Quantity adjustment (e.g. 5 or -2)</label><input class="field-input" type="number" name="delta" step="1" required value="1"><p style="color:#94a2b1;font-size:11px">Stock cannot drop below zero.</p></form>`,formFooter('Update Stock'))}
function openJob(){modalShell('New Repair Job Card','Record the device intake and repair request',`<form id="modal-form" data-form="job"><div class="form-grid">${selectField('Customer *','customerId',[['','Choose customer...'],...data.customers.map(c=>[c.id,`${c.name} · ${c.phone}`])])}${field('Device / model','device','text','',true)}${field('IMEI / serial (optional)','imei','text','')}${field('Assigned technician','technician','text','')}${field('Estimated cost (Rs.)','estimate','number','0',true,'min="0" step="0.01"')}${field('Expected completion','due','date',offsetDay(2))}${textArea('Reported problem / repair required','issue')}${textArea('Internal notes','notes')}</div></form>`,formFooter('Create Job Card'))}
function openJobDetails(id){const j=data.jobs.find(x=>x.id===id);if(!j)return;const c=customer(j.customerId);modalShell(`Repair Job ${j.id}`,`${esc(j.device)} · Created ${niceDate(j.created)}`,`<div class="detail-grid"><div><div class="detail-label">Customer</div><div class="detail-value">${esc(customerName(j.customerId))}<div class="muted" style="font-size:11px;margin-top:3px">${esc(c?.phone||'')}</div></div></div><div><div class="detail-label">Current status</div>${status(j.status)}</div><div><div class="detail-label">Device</div><div class="detail-value">${esc(j.device)}</div></div><div><div class="detail-label">IMEI / Serial</div><div class="detail-value">${esc(j.imei||'Not recorded')}</div></div><div><div class="detail-label">Technician</div><div class="detail-value">${esc(j.technician||'Unassigned')}</div></div><div><div class="detail-label">Expected Completion</div><div class="detail-value">${niceDate(j.due)}</div></div><div><div class="detail-label">Estimated Cost</div><div class="detail-value">${money(j.estimate)}</div></div><div><div class="detail-label">Job Reference</div><div class="detail-value">${j.id}</div></div></div><div class="detail-label">Reported issue</div><div class="detail-note">${esc(j.issue||'No issue recorded.')}</div><div style="margin-top:17px" class="detail-label">Technician notes</div><div class="detail-note">${esc(j.notes||'No internal notes.')}</div><div style="margin-top:19px"><label class="field-label">Update repair status</label><select class="field-select" style="max-width:240px" data-job-status="${j.id}">${['In Progress','Awaiting Parts','Ready','Completed','Cancelled'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn btn-light" data-action="print-job" data-id="${j.id}">${icon('print')} Print Job Card</button></div>`,'',true)}
function newQuote(){quoteDraft={customerId:'',device:'',issue:'',valid:offsetDay(7),notes:'',items:[{description:'',qty:1,rate:0}]};renderQuoteForm()}
function readQuoteInputs(){let f=$('#modal-form');if(!f||!quoteDraft)return;quoteDraft.customerId=f.elements.customerId.value;quoteDraft.device=f.elements.device.value;quoteDraft.issue=f.elements.issue.value;quoteDraft.valid=f.elements.valid.value;quoteDraft.notes=f.elements.notes.value;quoteDraft.items=$$('.quote-line',f).map(r=>({description:$('.quote-desc',r).value,qty:Number($('.quote-qty',r).value),rate:Number($('.quote-rate',r).value)}))}
function renderQuoteForm(){if(!quoteDraft)return;modalShell('New Quotation','Create an itemized repair estimate for a customer',`<form id="modal-form" data-form="quote"><div class="form-grid">${selectField('Customer *','customerId',[['','Choose customer...'],...data.customers.map(c=>[c.id,`${c.name} · ${c.phone}`])],quoteDraft.customerId)}${field('Device / Model','device','text',quoteDraft.device,true)}${field('Valid until','valid','date',quoteDraft.valid,true)}<div></div>${textArea('Repair / requested work','issue',quoteDraft.issue)}</div><div style="margin-top:22px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><strong style="font-size:13px">Estimate line items</strong><button type="button" class="btn btn-soft btn-sm" data-action="add-quote-line">${icon('plus')} Add line</button></div><div style="display:grid;grid-template-columns:minmax(0,1fr) 48px 95px 32px;gap:9px;margin-bottom:7px;color:#8d9ba9;font-size:10px;text-transform:uppercase;font-weight:800"><span>Description</span><span>Qty</span><span>Rate (Rs.)</span><span></span></div><div id="quote-lines">${quoteDraft.items.map((i,ix)=>`<div class="quote-line" data-ix="${ix}"><input class="field-input quote-desc" placeholder="Part or labour" value="${esc(i.description)}" required><input class="field-input quote-qty" type="number" min="1" step="1" value="${i.qty}" required><input class="field-input quote-rate" type="number" min="0" step="0.01" value="${i.rate}" required><button type="button" class="btn btn-light btn-icon btn-sm" data-action="remove-quote-line" data-ix="${ix}" aria-label="Remove line">${icon('x')}</button></div>`).join('')}</div><div class="quote-total-box"><span>Estimated Total</span><span id="quote-live-total">${money(quoteDraft.items.reduce((a,i)=>a+i.qty*i.rate,0))}</span></div><div style="margin-top:18px">${textArea('Quotation terms / notes','notes',quoteDraft.notes)}</div></form>`,formFooter('Create Quotation'),true)}
function openQuoteDetails(id){let q=data.quotes.find(x=>x.id===id);if(!q)return;let total=quoteTotal(q);modalShell(`Quotation ${q.id}`,`Created ${niceDate(q.created)} · Valid until ${niceDate(q.valid)}`,`<div class="detail-grid"><div><div class="detail-label">Customer</div><div class="detail-value">${esc(customerName(q.customerId))}<div class="muted" style="font-size:11px">${esc(customer(q.customerId)?.phone||'')}</div></div></div><div><div class="detail-label">Status</div>${status(q.status)}</div><div><div class="detail-label">Device</div><div class="detail-value">${esc(q.device)}</div></div><div><div class="detail-label">Repair Requested</div><div class="detail-value">${esc(q.issue||'—')}</div></div></div><div class="detail-label">Estimated Services & Parts</div><table class="receipt-table"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${shortMoney(i.rate)}</td><td>${shortMoney(i.qty*i.rate)}</td></tr>`).join('')}</tbody></table><div class="receipt-total">Total: ${money(total)}</div><div class="detail-label">Notes / Terms</div><div class="detail-note">${esc(q.notes||'—')}</div><div style="margin-top:19px"><label class="field-label">Quotation status</label><select class="field-select" style="max-width:200px" data-quote-status="${q.id}">${['Draft','Sent','Approved','Declined'].map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn btn-light" data-action="print-quote" data-id="${q.id}">${icon('print')} Print Quotation</button><button class="btn btn-primary" data-action="convert-quote" data-id="${q.id}">${icon('tool')} Convert to Job Card</button></div>`,'',true)}
function openSale(id){let s=data.sales.find(x=>x.id===id);if(!s)return;modalShell(`Sale Receipt ${s.id}`,`Completed ${niceDate(s.date)} · ${customerName(s.customerId)}`,`<div class="detail-grid"><div><div class="detail-label">Receipt Number</div><div class="detail-value">${s.id}</div></div><div><div class="detail-label">Customer</div><div class="detail-value">${esc(customerName(s.customerId))}</div></div></div><table class="receipt-table"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div class="info-pair"><span>Subtotal</span><strong>${money(s.subtotal)}</strong></div><div class="info-pair"><span>Discount</span><strong>− ${money(s.discount)}</strong></div><div class="receipt-total">Total Paid: ${money(s.total)}</div><div class="modal-actions"><button class="btn btn-primary" data-action="print-sale" data-id="${s.id}">${icon('print')} Print Receipt / Save PDF</button></div>`)}
function nextId(kind,prefix){data.counters[kind]=(data.counters[kind]||1000)+1;return prefix+data.counters[kind]}
function addCart(id){let p=product(id);if(!p)return;let item=cart.find(i=>i.id===id);if(p.category!=='Services'&&(item?.qty||0)>=p.stock){toast('Not enough units in stock');return}if(item)item.qty++;else cart.push({id,qty:1});render();toast(`${p.name} added to cart`)}
function changeCart(id,delta){let i=cart.find(x=>x.id===id),p=product(id);if(!i||!p)return;if(delta>0&&p.category!=='Services'&&i.qty>=p.stock){toast('No more stock available');return}i.qty+=delta;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);render()}
function checkout(){if(!cart.length)return;const sub=cart.reduce((n,i)=>n+i.qty*(product(i.id)?.price||0),0);for(const i of cart){const p=product(i.id);if(!p||(p.category!=='Services'&&i.qty>p.stock)){toast('Stock changed. Review your cart.');return}}const d=Math.min(Math.max(0,discount),sub);const sale={id:nextId('sale','S'),date:dateISO(),customerId:cartCustomer||null,items:cart.map(i=>({productId:i.id,name:product(i.id).name,qty:i.qty,price:product(i.id).price})),subtotal:sub,discount:d,total:sub-d};cart.forEach(i=>{let p=product(i.id);if(p.category!=='Services')p.stock-=i.qty});data.sales.push(sale);cart=[];cartCustomer='';discount=0;save();render();openSale(sale.id);toast(`Sale ${sale.id} completed successfully`)}
function submitForm(f){const fd=new FormData(f),get=k=>String(fd.get(k)||'').trim();let kind=f.dataset.form,id=f.dataset.id;if(kind==='customer'){let name=get('name'),phone=get('phone');if(!name||!phone){toast('Name and phone are required');return}let c=id?customer(id):null;if(c)Object.assign(c,{name,phone,email:get('email'),device:get('device')});else data.customers.push({id:nextId('customer','C'),name,phone,email:get('email'),device:get('device')});toast(id?'Customer updated':'Customer added')}
else if(kind==='product'){let p=id?product(id):null,category=get('category'),cost=Number(get('cost')),price=Number(get('price')),stock=Number(get('stock')),reorder=Number(get('reorder'));if(!get('name')||![cost,price,stock,reorder].every(Number.isFinite)||[cost,price,stock,reorder].some(x=>x<0)||!Number.isInteger(stock)||!Number.isInteger(reorder)){toast('Enter valid positive prices and stock amounts');return}let item={name:get('name'),category,cost,price,stock:category==='Services'?0:stock,reorder:category==='Services'?0:reorder,emoji:get('emoji')||'📦'};if(p)Object.assign(p,item);else data.products.push({id:nextId('product','P'),...item});toast(id?'Inventory item updated':'Product added')}
else if(kind==='stock'){let p=product(id),delta=Number(get('delta'));if(!p||!Number.isInteger(delta)||p.stock+delta<0){toast('Please enter a valid adjustment');return}p.stock+=delta;toast('Inventory stock updated')}
else if(kind==='job'){if(!get('customerId')||!get('device')){toast('Select a customer and enter the device');return}let estimate=Number(get('estimate'));if(!Number.isFinite(estimate)||estimate<0){toast('Enter a valid estimated cost');return}data.jobs.push({id:nextId('job','J'),customerId:get('customerId'),device:get('device'),imei:get('imei'),issue:get('issue'),technician:get('technician'),estimate,status:'In Progress',created:dateISO(),due:get('due'),notes:get('notes')});toast('Repair job card created')}
else if(kind==='quote'){readQuoteInputs();let q=quoteDraft;if(!q.customerId||!q.device||!q.items.length||q.items.some(i=>!i.description.trim()||!Number.isInteger(i.qty)||i.qty<1||!Number.isFinite(i.rate)||i.rate<0)){toast('Complete the customer, device and line items');return}data.quotes.push({id:nextId('quote','Q'),...JSON.parse(JSON.stringify(q)),status:'Draft',created:dateISO()});quoteDraft=null;toast('Quotation created')}
save();$('#modal-root').innerHTML='';render()}
function safePrint(title,html){let w=window.open('','_blank','width=850,height=780');if(!w){toast('Allow pop-ups to print or save as PDF.');return}let css=`body{font-family:Arial,sans-serif;color:#1d3041;margin:42px;font-size:12px}header{display:flex;justify-content:space-between;border-bottom:3px solid #15a997;padding-bottom:19px;margin-bottom:25px}h1{font-size:26px;margin:0;color:#133a42}h2{font-size:17px;margin:0 0 15px}p{margin:5px 0;color:#5d6d7c}.meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:25px}.meta div{flex:1}table{border-collapse:collapse;width:100%;margin-top:15px}th{text-transform:uppercase;font-size:10px;background:#eef5f5}td,th{padding:12px;text-align:left;border-bottom:1px solid #e3ebed}td:last-child,th:last-child{text-align:right}.grand{text-align:right;font-size:20px;font-weight:bold;margin-top:22px}.foot{margin-top:55px;color:#8396a3;text-align:center;border-top:1px solid #e6eaea;padding-top:16px;line-height:1.5}strong{color:#203447}.note{margin:20px 0;padding:14px;background:#f5f8f9;white-space:pre-wrap;line-height:1.55}@media print{body{margin:14mm}}`;w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body><header><div><h1>${esc(data.settings.name)}</h1><p>${esc(data.settings.address)}</p><p>${esc(data.settings.phone)}</p></div><div style="text-align:right"><h2>${esc(title)}</h2><p>${niceDate(dateISO())}</p></div></header>${html}<div class="foot">Thank you for choosing ${esc(data.settings.name)}.<br>Generated with FixPoint Demo POS</div></body></html>`);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch(_){}},300)}
function printSale(id){let s=data.sales.find(x=>x.id===id);if(!s)return;safePrint('SALES RECEIPT',`<div class="meta"><div><strong>Receipt:</strong> ${esc(s.id)}<p>Date: ${niceDate(s.date)}</p></div><div><strong>Customer:</strong> ${esc(customerName(s.customerId))}</div></div><table><thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div style="text-align:right;margin-top:15px">Subtotal: ${money(s.subtotal)}<p>Discount: − ${money(s.discount)}</p></div><div class="grand">TOTAL PAID: ${money(s.total)}</div>`)}
function printQuote(id){let q=data.quotes.find(x=>x.id===id);if(!q)return;safePrint('REPAIR QUOTATION',`<div class="meta"><div><strong>Quotation:</strong> ${q.id}<p>Date: ${niceDate(q.created)}</p><p>Valid Until: ${niceDate(q.valid)}</p></div><div><strong>Customer:</strong> ${esc(customerName(q.customerId))}<p>Device: ${esc(q.device)}</p></div></div><p><strong>Repair request:</strong> ${esc(q.issue)}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${money(i.qty*i.rate)}</td></tr>`).join('')}</tbody></table><div class="grand">TOTAL ESTIMATE: ${money(quoteTotal(q))}</div><div class="note"><strong>Notes / Terms:</strong> ${esc(q.notes||'—')}</div>`)}
function printJob(id){let j=data.jobs.find(x=>x.id===id);if(!j)return;safePrint('REPAIR JOB CARD',`<div class="meta"><div><strong>Job:</strong> ${j.id}<p>Received: ${niceDate(j.created)}</p><p>Due: ${niceDate(j.due)}</p></div><div><strong>Customer:</strong> ${esc(customerName(j.customerId))}<p>Phone: ${esc(customer(j.customerId)?.phone||'')}</p></div></div><table><tbody><tr><td><strong>Device</strong></td><td>${esc(j.device)}</td></tr><tr><td><strong>IMEI / Serial</strong></td><td>${esc(j.imei||'—')}</td></tr><tr><td><strong>Technician</strong></td><td>${esc(j.technician||'Unassigned')}</td></tr><tr><td><strong>Status</strong></td><td>${esc(j.status)}</td></tr><tr><td><strong>Estimated Repair Cost</strong></td><td>${money(j.estimate)}</td></tr></tbody></table><div class="note"><strong>Reported Issue:</strong> ${esc(j.issue||'—')}</div><div class="note"><strong>Internal Repair Notes:</strong> ${esc(j.notes||'—')}</div><div style="display:flex;justify-content:space-between;margin-top:65px"><div>______________________<p>Customer signature</p></div><div>______________________<p>Received by</p></div></div>`)}
function exportBackup(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');let u=URL.createObjectURL(blob);a.href=u;a.download=`fixpoint-backup-${dateISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Backup exported')}
function resetDemo(){if(!confirm('Reset all sample data and erase changes made in this browser?'))return;data=sampleData();cart=[];cartCustomer='';discount=0;filters={pos:'',category:'All',inventory:'',inventoryCategory:'All',jobs:'',jobStatus:'All',quotes:'',quoteStatus:'All',customers:''};save();render();toast('Sample workspace restored')}
function handleAction(action,id){if(action==='new-job')openJob();else if(action==='new-quote')newQuote();else if(action==='new-product')openProduct();else if(action==='new-customer')openCustomer();else if(action==='edit-customer')openCustomer(id);else if(action==='edit-product')openProduct(id);else if(action==='adjust-stock')openStock(id);else if(action==='view-job')openJobDetails(id);else if(action==='view-quote')openQuoteDetails(id);else if(action==='view-sale')openSale(id);else if(action==='checkout')checkout();else if(action==='clear-cart'){cart=[];discount=0;render();toast('Cart cleared')}else if(action==='close-modal')$('#modal-root').innerHTML='';else if(action==='add-quote-line'){readQuoteInputs();quoteDraft.items.push({description:'',qty:1,rate:0});renderQuoteForm()}else if(action==='remove-quote-line'){if(quoteDraft.items.length===1){toast('At least one quote line is required');return}readQuoteInputs();quoteDraft.items.splice(Number(id),1);renderQuoteForm()}else if(action==='print-job')printJob(id);else if(action==='print-quote')printQuote(id);else if(action==='print-sale')printSale(id);else if(action==='convert-quote'){let q=data.quotes.find(x=>x.id===id);if(!q)return;if(q.status==='Declined'){toast('Declined quotations cannot be converted');return}let existing=data.jobs.find(j=>j.sourceQuote===q.id);if(existing){openJobDetails(existing.id);toast('This quote already has a repair job');return}let j={id:nextId('job','J'),customerId:q.customerId,device:q.device,imei:'',issue:q.issue||'Repair per quotation '+q.id,technician:'',estimate:quoteTotal(q),status:'In Progress',created:dateISO(),due:offsetDay(3),notes:'Created from quotation '+q.id+'\n'+q.items.map(i=>`${i.qty} × ${i.description}: ${money(i.qty*i.rate)}`).join('\n'),sourceQuote:q.id};data.jobs.push(j);q.status='Approved';save();setView('jobs');openJobDetails(j.id);toast(`${q.id} converted to ${j.id}`)}else if(action==='export')exportBackup();else if(action==='reset')resetDemo()}
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return}const add=ev.target.closest('[data-add]');if(add){addCart(add.dataset.add);return}const plus=ev.target.closest('[data-cartplus]');if(plus){changeCart(plus.dataset.cartplus,1);return}const minus=ev.target.closest('[data-cartminus]');if(minus){changeCart(minus.dataset.cartminus,-1);return}const remove=ev.target.closest('[data-remove]');if(remove){cart=cart.filter(i=>i.id!==remove.dataset.remove);render();return}const action=ev.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action.dataset.ix??action.dataset.id);return}if(ev.target.id==='modal-backdrop')$('#modal-root').innerHTML=''});
document.addEventListener('submit',ev=>{if(ev.target.id==='modal-form'){ev.preventDefault();submitForm(ev.target)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.filter){const id=t.id,at=t.selectionStart;filters[t.dataset.filter]=t.value;render();let n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(at,at)}catch(e){}}}if(t.closest('#quote-lines')){let rows=$$('.quote-line');let sum=rows.reduce((a,r)=>a+(Number($('.quote-qty',r).value)||0)*(Number($('.quote-rate',r).value)||0),0);let x=$('#quote-live-total');if(x)x.textContent=money(sum)}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='cart-customer')cartCustomer=t.value;else if(t.id==='cart-discount'){discount=Math.max(0,Number(t.value)||0);render()}else if(t.id==='job-status-filter'){filters.jobStatus=t.value;render()}else if(t.id==='quote-status-filter'){filters.quoteStatus=t.value;render()}else if(t.id==='inventory-cat-filter'){filters.inventoryCategory=t.value;render()}else if(t.dataset.jobStatus){let j=data.jobs.find(x=>x.id===t.dataset.jobStatus);if(j){j.status=t.value;save();render();openJobDetails(j.id);toast('Job status updated')}}else if(t.dataset.quoteStatus){let q=data.quotes.find(x=>x.id===t.dataset.quoteStatus);if(q){q.status=t.value;save();render();openQuoteDetails(q.id);toast('Quotation status updated')}}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-category]');if(t){filters.category=t.dataset.category;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#modal-root').innerHTML='';$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')}});
$('#menu-toggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')});
render();
</script>
